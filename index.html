<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ລະບົບ POS ຮ້ານອາຫານ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#141a18; --panel:#1c2422; --panelAlt:#212b28; --line:#2c3733;
    --text:#ede7da; --dim:#9da9a2; --brass:#c69a4a; --brassHi:#dcae5c;
    --chili:#b8503f; --leaf:#5c8563;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family: ui-sans-serif, system-ui, "Noto Sans Lao", sans-serif; }
  button{ font-family:inherit; cursor:pointer; border:none; }
  input,select{ font-family:inherit; }
  .hidden{ display:none !important; }

  /* ---------- layout helpers ---------- */
  .p4{ padding:16px; } .p6{ padding:24px; }
  .row{ display:flex; align-items:center; }
  .between{ justify-content:space-between; }
  .wrap{ flex-wrap:wrap; }
  .gap2{ gap:8px; } .gap3{ gap:12px; }
  .grow{ flex:1; }
  .center{ align-items:center; }

  /* ---------- header ---------- */
  header.top{ display:flex; justify-content:space-between; align-items:center; padding:16px 24px; border-bottom:1px solid var(--line); flex-wrap:wrap; gap:10px; }
  .brand{ display:flex; gap:10px; align-items:center; }
  .brand .logo{ width:38px; height:38px; border-radius:50%; background:var(--brass); display:flex; align-items:center; justify-content:center; font-size:18px; }
  .brand h1{ font-size:18px; margin:0; letter-spacing:0.5px; }
  .brand p{ font-size:11px; margin:0; color:var(--dim); }

  .lang-switch{ display:flex; gap:2px; align-items:center; }
  .lang-switch button{ font-size:11px; padding:5px 8px; border-radius:6px; background:transparent; color:var(--dim); }
  .lang-switch button.active{ background:var(--brass); color:var(--bg); }

  .btn{ padding:9px 14px; border-radius:10px; font-size:13px; background:var(--panel); color:var(--text); border:1px solid var(--line); display:inline-flex; align-items:center; gap:6px; }
  .btn.brass{ background:var(--brass); color:var(--bg); border:none; }
  .btn.leaf{ background:var(--leaf); color:var(--bg); border:none; }
  .btn.chili{ border:1px solid var(--chili); color:var(--chili); background:transparent; }
  .btn.chili-solid{ background:var(--chili); color:#fff; border:none; }
  .btn.ghost{ background:transparent; border:1px dashed var(--dim); color:var(--dim); }
  .btn:disabled{ opacity:0.3; }
  .btn.sm{ padding:6px 10px; font-size:12px; }

  /* ---------- floor ---------- */
  .table-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; padding:24px; }
  @media(min-width:600px){ .table-grid{ grid-template-columns:repeat(3,1fr);} }
  @media(min-width:900px){ .table-grid{ grid-template-columns:repeat(5,1fr);} }
  .table-card{ border-radius:12px; padding:14px; text-align:left; background:var(--panel); border:1px solid var(--line); }
  .table-card.occupied{ background:var(--panelAlt); border-color:var(--brass); }
  .table-card .badge{ font-size:10px; padding:2px 7px; border-radius:999px; background:var(--brass); color:var(--bg); }
  .table-card .status{ font-size:12px; color:var(--dim); display:flex; align-items:center; gap:4px; margin-top:6px;}
  .table-card .amt{ margin-top:8px; color:var(--brass); font-size:14px; }
  .sync-note{ font-size:11px; color:var(--dim); display:flex; align-items:center; gap:5px; }
  .sync-note.err{ color:var(--chili); }

  /* ---------- order screen ---------- */
  .order-wrap{ display:flex; flex-direction:column; }
  @media(min-width:860px){ .order-wrap{ flex-direction:row; } }
  .menu-col{ flex:3; padding:16px; }
  .bill-col{ flex:2; padding:16px; border-top:1px solid var(--line); }
  @media(min-width:860px){ .bill-col{ border-top:none; border-left:1px solid var(--line);} }

  .cat-tabs{ display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; padding-bottom:4px;}
  .cat-tabs button{ white-space:nowrap; padding:9px 14px; border-radius:10px; background:var(--panel); color:var(--text); font-size:13px; display:flex; gap:6px; align-items:center;}
  .cat-tabs button.active{ background:var(--brass); color:var(--bg); }

  .search-box{ width:100%; padding:10px 12px; border-radius:10px; background:var(--panelAlt); border:1px solid var(--line); color:var(--text); font-size:13px; margin-bottom:12px; }

  .menu-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .menu-card{ border-radius:10px; overflow:hidden; background:var(--panel); border:1px solid var(--line); }
  .menu-card .thumb{ width:100%; height:80px; background:var(--panelAlt); display:flex; align-items:center; justify-content:center; font-size:34px; overflow:hidden; }
  .menu-card .thumb img{ width:100%; height:100%; object-fit:cover; }
  .menu-card .info{ padding:10px; cursor:pointer; }
  .menu-card .info .name{ font-size:13px; margin-bottom:3px; }
  .menu-card .info .price{ font-size:12px; color:var(--brass); }
  .menu-card .info .stock{ font-size:10px; color:var(--dim); margin-top:2px;}
  .menu-card .info .stock.low{ color:var(--chili); }
  .menu-card .actions{ display:flex; border-top:1px solid var(--line); }
  .menu-card .actions button{ flex:1; background:transparent; color:var(--dim); font-size:10px; padding:6px 0; display:flex; align-items:center; justify-content:center; gap:3px; }
  .menu-card .actions button.danger{ color:var(--chili); }
  .menu-card .actions button+button{ border-left:1px solid var(--line); }
  .add-item-card{ border-radius:10px; border:1px dashed var(--dim); color:var(--dim); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:26px 0; font-size:12px; background:transparent; }

  .bill-line{ border-radius:10px; padding:10px; margin-bottom:8px; background:var(--panel); border:1px solid var(--line); }
  .bill-line.cancelled{ background:transparent; border-color:var(--chili); opacity:0.5; }
  .bill-line .top{ display:flex; justify-content:space-between; font-size:13px; }
  .bill-line .note{ font-size:11px; color:var(--dim); margin-top:4px; display:flex; gap:4px; align-items:center;}
  .bill-line .qty-row{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .qty-btn{ width:24px; height:24px; border-radius:6px; background:var(--panelAlt); color:var(--text); display:flex; align-items:center; justify-content:center; }
  .tag-btn{ font-size:9px; padding:3px 6px; border-radius:6px; background:var(--panelAlt); color:var(--dim); }
  .tag-btn.active{ background:var(--brass); color:var(--bg); }
  .sent-row{ display:flex; justify-content:space-between; margin-top:8px; font-size:11px; }

  .bill-tab{ padding:7px 12px; border-radius:8px; font-size:13px; background:var(--panelAlt); color:var(--text); border:1px solid var(--line); }
  .bill-tab.active{ background:var(--brass); color:var(--bg); }

  /* ---------- modal ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal{ width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; max-height:90vh; overflow-y:auto; }
  .modal.danger{ border-color:var(--chili); }
  .modal h3{ font-size:14px; margin:0; }
  .modal .mtop{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .field{ font-size:12px; color:var(--dim); display:block; margin-bottom:10px; }
  .field input, .field select{ width:100%; margin-top:5px; padding:9px; border-radius:8px; background:var(--panelAlt); color:var(--text); border:1px solid var(--line); font-size:13px; }
  .modal .err{ font-size:12px; color:var(--chili); margin-bottom:8px; }
  .qr-box{ background:#fff; padding:10px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin:10px 0; }

  /* ---------- reports ---------- */
  .tabs-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px;}
  .tabs-row button{ white-space:nowrap; padding:8px 12px; border-radius:10px; background:var(--panel); color:var(--text); font-size:12px; display:flex; gap:6px; align-items:center;}
  .tabs-row button.active{ background:var(--brass); color:var(--bg); }
  .stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; max-width:640px; }
  @media(min-width:600px){ .stat-grid{ grid-template-columns:repeat(4,1fr);} }
  .stat-card{ border-radius:10px; padding:12px; background:var(--panel); border:1px solid var(--line); }
  .stat-card .label{ font-size:11px; color:var(--dim); margin-bottom:4px;}
  .stat-card .value{ font-size:16px; }
  .list-row{ display:flex; justify-content:space-between; align-items:center; border-radius:10px; padding:10px 12px; background:var(--panel); border:1px solid var(--line); margin-bottom:8px; max-width:640px; }
  .rank-group h3{ font-size:13px; display:flex; gap:6px; align-items:center; margin-bottom:8px;}
  .barcode-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; max-width:640px;}
  .barcode-card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .void-card{ border-radius:10px; padding:10px; background:var(--panel); border:1px solid var(--chili); font-size:12px; margin-bottom:8px; max-width:640px;}

  /* ---------- checkout ---------- */
  .checkout-wrap{ max-width:420px; margin:0 auto; padding:16px; }
  .receipt-box{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  .receipt-line{ display:flex; justify-content:space-between; font-size:13px; padding:3px 0; }
  .field-2col{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .method-row{ display:flex; gap:8px; margin:10px 0; }
  .method-row button{ flex:1; padding:9px; border-radius:8px; background:var(--panel); color:var(--text); font-size:13px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .method-row button.active{ background:var(--brass); color:var(--bg); }
  .net-box{ background:var(--panelAlt); border-radius:10px; padding:12px; margin:10px 0; }
  .net-box .row{ justify-content:space-between; font-size:13px; padding:2px 0;}

  #print-area{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #print-area, #print-area *{ visibility:visible; }
    #print-area{ display:block; position:absolute; top:0; left:0; width:100%; padding:20px; color:#000; background:#fff; }
    #print-area .p-line{ display:flex; justify-content:space-between; font-size:13px; padding:2px 0; }
  }
</style>
</head>
<body>

<div id="app"></div>

<div id="print-area">
  <h2 id="p-title" style="text-align:center;margin:0 0 4px;"></h2>
  <p id="p-sub" style="text-align:center;margin:0 0 14px;font-size:12px;"></p>
  <hr/>
  <div id="p-lines"></div>
  <hr/>
  <div id="p-total" style="font-weight:bold;"></div>
  <p id="p-thanks" style="text-align:center;margin-top:20px;font-size:12px;"></p>
</div>

const CODE39 = {
  "0":"000110100","1":"100100001","2":"001100001","3":"101100000","4":"000110001",
  "5":"100110000","6":"001110000","7":"000100101","8":"100100100","9":"001100100","*":"010010100",
};
function barcodeSvg(value, height){
  height = height || 44;
  const chars = ("*"+value+"*").split("");
  const NARROW=2, WIDE=5; let x=0; const bars=[];
  chars.forEach(ch=>{
    const pattern = CODE39[ch] || CODE39["0"];
    for(let i=0;i<pattern.length;i++){
      const wide = pattern[i]==="1"; const w = wide?WIDE:NARROW; const isBar = i%2===0;
      if(isBar) bars.push({x,w});
      x+=w;
    }
    x+=NARROW;
  });
  const totalWidth = x;
  let rects = bars.map(b=>`<rect x="${b.x}" y="4" width="${b.w}" height="${height-20}" fill="#111"/>`).join("");
  return `<svg width="${totalWidth}" height="${height}" viewBox="0 0 ${totalWidth} ${height}">
    <rect x="0" y="0" width="${totalWidth}" height="${height}" fill="#fff"/>${rects}
    <text x="${totalWidth/2}" y="${height-5}" font-size="10" text-anchor="middle" fill="#111" font-family="monospace">${value}</text>
  </svg>`;
}

function loadLocalCache(){
  try{
    const raw = localStorage.getItem(LOCAL_CACHE_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(data.tables) state.tables = data.tables;
    if(data.menu) state.menu = data.menu;
    if(data.customers) state.customers = data.customers;
    if(data.bankAccounts) state.bankAccounts = data.bankAccounts;
    if(data.salesLog) state.salesLog = data.salesLog;
    if(data.voidLog) state.voidLog = data.voidLog;
    if(typeof data.syncVersion==="number") state.syncVersion = data.syncVersion;

  if(!state.sheetUrl) throw new Error("no-url");
  let url = state.sheetUrl;
  const qs = new URLSearchParams(params||{}).toString();
  if(qs) url += (url.includes("?")?"&":"?") + qs;
  const opts = { method };
  if(method==="POST"){
    opts.headers = { "Content-Type":"text/plain;charset=utf-8" };
    opts.body = JSON.stringify(body||{});
  }
  const res = await fetch(url, opts);
  if(!res.ok) throw new Error("http-"+res.status);
  return await res.json();
}

async function loadData(){
  loadLocalCache();
  seedCountersFromState();
  state.loaded = true;
  render();

  if(state.sheetUrl){
    await pullStateOnce({ bootstrapIfEmpty:true });
    await refreshLogs();
    startSyncLoop();
  }
}

async function pullStateOnce(opts){
  opts = opts||{};
  try{
    const res = await sheetCall("GET", { action:"getState" });
    if(res && res.ok && res.state && res.version>0){
      if(res.version !== state.syncVersion){
        state.tables = res.state.tables || state.tables;
        state.menu = res.state.menu || state.menu;
        state.customers = res.state.customers || state.customers;
        state.bankAccounts = res.state.bankAccounts || state.bankAccounts;
        state.syncVersion = res.version;
        seedCountersFromState();
        saveLocalCache();
        render();
      }
      state.syncError = false;
    } else if(opts.bootstrapIfEmpty){
      await pushHotState({ immediate:true });
    }
    state.syncError = false;
  }catch(e){
    state.syncError = true;
  }
  renderSyncBadgeOnly();
}

function pushHotState(opts){
  opts = opts || {};
  saveLocalCache();
  if(!state.sheetUrl) return Promise.resolve();
  if(pushDebounceTimer) clearTimeout(pushDebounceTimer);
  const run = async ()=>{
    try{
      const res = await sheetCall("POST", { action:"saveState" }, { state: hotStatePayload() });
      if(res && res.ok){ state.syncVersion = res.version; state.syncError = false; pendingPush=false; }
      else { state.syncError = true; pendingPush=true; }
    }catch(e){ state.syncError = true; pendingPush = true; }
    renderSyncBadgeOnly();
  };
  if(opts.immediate) return run();
  return new Promise(resolve=>{
    pushDebounceTimer = setTimeout(()=>{ run().then(resolve); }, 600);
  });
}

async function refreshLogs(){
  if(!state.sheetUrl) return;
  try{
    const res = await sheetCall("GET", { action:"getLogs" });
    if(res && res.ok){
      if(Array.isArray(res.sales)) state.salesLog = res.sales;
      if(Array.isArray(res.voids)) state.voidLog = res.voids;
      saveLocalCache();
      if(state.view.screen==="reports") render();
    }
  }catch(e){ /* ຂ້າມ — ໃຊ້ Log ທ້ອງຖິ່ນເກົ່າໄປກ່ອນ */ }
}

function startSyncLoop(){
  if(syncPollTimer) clearInterval(syncPollTimer);
  let tick = 0;
  syncPollTimer = setInterval(()=>{
    if(document.hidden) return;
    tick++;
    pullStateOnce({});
    if(pendingPush) pushHotState({ immediate:true });
    if(tick % 5 === 0) refreshLogs();
  }, 5000);
  document.addEventListener("visibilitychange", ()=>{
    if(!document.hidden && state.sheetUrl){ pullStateOnce({}); }
  });
}

function saveData(){ return pushHotState({}); }
function persistAndRender(){ render(); saveData(); }

async function appendSaleRemote(record){
  if(!state.sheetUrl) return;

}
async function appendVoidRemote(record){

}
async function testSheetConnection(){
  try{
    const res = await sheetCall("GET", { action:"ping" });
    return !!(res && res.ok);
  }catch(e){ return false; }
}
function setSheetUrl(url){
  state.sheetUrl = url||"";
  saveSheetUrlLocal(state.sheetUrl);
  if(state.sheetUrl){
    pullStateOnce({ bootstrapIfEmpty:true }).then(()=>refreshLogs());
    startSyncLoop();
  } else if(syncPollTimer){
    clearInterval(syncPollTimer); syncPollTimer=null;
  }
  renderSyncBadgeOnly();
}
function disconnectSheet(){
  if(syncPollTimer){ clearInterval(syncPollTimer); syncPollTimer=null; }
  state.sheetUrl = "";
  saveSheetUrlLocal("");
  state.syncError=false;

function addItemToBill(menuItem){
  const bill = activeBill(); if(!bill) return;
  const existing = bill.items.find(it=>it.menuId===menuItem.id && it.status==="draft");
  if(existing){ existing.qty++; }
  else{
    bill.items.push({
      lineId: `${menuItem.id}-${Date.now()}-${Math.random()}`,
      menuId: menuItem.id, name: menuItem.name[state.lang]||menuItem.name.lo,
      price: menuItem.price, cost: menuItem.cost||0, qty:1, note:"", status:"draft",
    });
  }
  persistAndRender();
}
function changeQty(lineId,delta){
  const bill = activeBill();
  bill.items = bill.items.map(it=> it.lineId===lineId ? {...it, qty: Math.max(0,it.qty+delta)} : it)
                          .filter(it=> it.qty>0 || it.status!=="draft");
  persistAndRender();
}

}
function doCancelSentItem(lineId,staff,reason){

function doUploadImageFile(menuId,file){
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 320;
      let w=img.width, h=img.height;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width=w; canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      const dataUrl = canvas.toDataURL("image/jpeg",0.6);
      const m = state.menu.find(x=>x.id===menuId);
      if(m) m.image = dataUrl;
      state.modal=null; persistAndRender();
    };
    img.onerror = ()=>{ state.modal=null; render(); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

  const app = document.getElementById("app");
  if(!state.loaded){
    app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:14px;">${t("loading",state.lang)}</div>`;
    return;
  }
  const screen = state.view.screen;
  if(screen==="floor") app.innerHTML = renderFloor();
  else if(screen==="order") app.innerHTML = renderOrder();
  else if(screen==="reports") app.innerHTML = renderReports();

}

  const revenue = state.salesLog.reduce((s,sale)=>s+sale.total,0);
  const cost = state.salesLog.reduce((s,sale)=>s+sale.totalCost,0);
  const profit = revenue-cost;
  const qtyByItem = {};
  state.salesLog.forEach(sale=> sale.items.forEach(it=>{ qtyByItem[it.menuId]=(qtyByItem[it.menuId]||0)+it.qty; }));
  const ranked = state.menu.map(m=>({...m, sold: qtyByItem[m.id]||0})).sort((a,b)=>b.sold-a.sold);
  const third = Math.ceil(ranked.length/3)||1;
  const best = ranked.slice(0,third), medium = ranked.slice(third,third*2), worst = ranked.slice(third*2);

  const tabs = [
    {id:"overview", label:t("overview",state.lang), ico:ICO.chart},
    {id:"stock", label:t("stockLabel",state.lang), ico:ICO.box},
    {id:"rank", label:`${t("bestSellers",state.lang)}/${t("worstSellers",state.lang)}`, ico:"📈"},
    {id:"barcodes", label:t("barcodes",state.lang), ico:ICO.scan},
    {id:"voids", label:t("voidLog",state.lang), ico:ICO.shield},
    {id:"sales", label:t("salesHistory",state.lang), ico:ICO.history},
    {id:"customers", label:t("customers",state.lang), ico:ICO.users},
  ];
  const tabsHtml = tabs.map(tb=>`<button class="${state.reportTab===tb.id?'active':''}" data-act="reporttab" data-tab="${tb.id}">${tb.ico} ${tb.label}</button>`).join("");

  let body = "";
  if(state.reportTab==="overview"){
    body = `<div class="stat-grid">
      <div class="stat-card"><div class="label">${t("revenue",state.lang)}</div><div class="value" style="color:var(--brass)">${money(revenue)}</div></div>
      <div class="stat-card"><div class="label">${t("costLabel",state.lang)}</div><div class="value" style="color:var(--dim)">${money(cost)}</div></div>
      <div class="stat-card"><div class="label">${t("profitLabel",state.lang)}</div><div class="value" style="color:var(--leaf)">${money(profit)}</div></div>
      <div class="stat-card"><div class="label">${t("transactionsCount",state.lang)}</div><div class="value">${state.salesLog.length}</div></div>
    </div>
    ${state.salesLog.length===0?`<p style="color:var(--dim);font-size:13px;margin-top:14px;">${t("noSalesYet",state.lang)}</p>`:""}
    <p style="color:var(--dim);font-size:11px;margin-top:14px;">${state.sheetUrl ? t("sheetConnectedNote",state.lang) : t("sheetNotConnected",state.lang)}</p>
    <div class="row gap2" style="margin-top:8px;">
      <button class="btn brass" data-act="opensyncsettings">📊 ${t("sheetSettings",state.lang)}</button>
      <button class="btn chili" data-act="openreset">${ICO.trash} ${t("resetAllData",state.lang)}</button>
    </div>`;
  }
  else if(state.reportTab==="stock"){
    body = state.menu.map(m=>{
      const low = (m.stock??0)<=10;
      return `<div class="list-row"><span>${m.emoji} ${m.name[state.lang]||m.name.lo}</span>
        <div class="row gap3">
          <span style="color:${low?'var(--chili)':'var(--text)'}">${m.stock??0} ${t("unitsLeft",state.lang)}${low?` · ${t("lowStock",state.lang)}`:""}</span>
          <button class="btn sm brass" data-act="openreceive" data-id="${m.id}">${ICO.box} ${t("receiveStock",state.lang)}</button>
        </div>
      </div>`;
    }).join("");
  }
  else if(state.reportTab==="rank"){
    const grp = (title,color,arr)=>`<div class="rank-group"><h3 style="color:${color}">${title}</h3>${arr.length===0?`<p style="color:var(--dim);font-size:12px;">—</p>`:arr.map(m=>`<div class="list-row"><span>${m.emoji} ${m.name[state.lang]||m.name.lo}</span><span style="color:var(--brass)">${m.sold} ${t("qtySold",state.lang)}</span></div>`).join("")}</div>`;
    body = grp(t("bestSellers",state.lang),"var(--leaf)",best) + grp(t("mediumSellers",state.lang),"var(--brass)",medium) + grp(t("worstSellers",state.lang),"var(--chili)",worst);
  }
  else if(state.reportTab==="barcodes"){
    body = `<div class="barcode-grid">${state.menu.map(m=>`<div class="barcode-card"><span style="font-size:13px;">${m.name[state.lang]||m.name.lo}</span>${barcodeSvg(m.sku)}</div>`).join("")}</div>`;
  }
  else if(state.reportTab==="voids"){
    body = state.voidLog.length===0 ? `<p style="color:var(--dim);font-size:13px;">${t("noVoidsYet",state.lang)}</p>` :
      state.voidLog.map(v=>`<div class="void-card">
        <div class="row between"><span style="color:var(--chili)">${v.type==="bill"?t("voidBillType",state.lang):t("voidItemType",state.lang)}</span><span style="color:var(--dim)">${new Date(v.time).toLocaleString()}</span></div>
        <div>${t("who",state.lang)}: ${v.who}</div><div>${t("staff",state.lang)}: ${v.staff}</div><div>${t("reasonLabel",state.lang)}: ${v.reason}</div>
      </div>`).join("");
  }
  else if(state.reportTab==="sales"){
    body = state.salesLog.length===0 ? `<p style="color:var(--dim);font-size:13px;">${t("noSalesYet",state.lang)}</p>` :
      state.salesLog.map(s=>`<div class="list-row" style="flex-direction:column;align-items:stretch;">
        <div class="row between"><span>${s.tableName} / ${s.billLabel} — ${s.staff}</span><span style="color:var(--dim);font-size:11px;">${new Date(s.time).toLocaleString()}</span></div>
        <div class="row between" style="margin-top:4px;"><span style="color:var(--dim);font-size:12px;">${s.items.map(it=>it.name+" x"+it.qty).join(", ")}</span><span style="color:var(--brass)">${money(s.total)}</span></div>
      </div>`).join("");
  }
  else if(state.reportTab==="customers"){
    body = `<button class="btn brass" data-act="opencustomer" style="margin-bottom:12px;">➕ ${t("addCustomer",state.lang)}</button>` +
      (state.customers.length===0 ? `<p style="color:var(--dim);font-size:13px;">${t("noCustomersYet",state.lang)}</p>` :
      state.customers.map(c=>`<div class="list-row">
        <div><div>${c.name}</div><div style="font-size:11px;color:var(--dim);">${c.phone||""} ${c.note?`· ${c.note}`:""}</div></div>
        <div class="row gap2"><button class="btn sm" data-act="opencustomer" data-id="${c.id}">${ICO.pencil}</button><button class="btn sm chili" data-act="opendeletecustomer" data-id="${c.id}">${ICO.trash}</button></div>
      </div>`).join(""));
  }

  return `
  <header class="top"><div class="row gap3"><button data-act="backfloor" class="btn sm">${ICO.back}</button><h1 style="font-size:16px;margin:0;flex:1;">${t("reports",state.lang)}</h1></div>${langSwitcherHtml()}</header>
  <div class="p4">
    <div class="tabs-row">${tabsHtml}</div>
    ${body}
  </div>
  `;
}

/* =========================================================
   EVENT WIRING
========================================================= */
function attachGlobalHandlers(){
  document.querySelectorAll("[data-act]").forEach(el=>{
    if(el._wired) return;
    el._wired = true;
    el.addEventListener("click", onAction);
  });
  const searchInput = document.getElementById("search-input");
  if(searchInput){
    searchInput.addEventListener("input", (e)=>{ state.searchTerm = e.target.value; render(); setTimeout(()=>{const i=document.getElementById("search-input"); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },0); });
  }
  ["ck-discount","ck-tip","ck-received"].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener("input",(e)=>{
      const ck = state._checkout;
      if(id==="ck-discount") ck.discount = Number(e.target.value)||0;
      if(id==="ck-tip") ck.tip = Number(e.target.value)||0;
      if(id==="ck-received") ck.received = e.target.value;
      render();
    });
  });
}

function onAction(e){
  const el = e.currentTarget;
  const act = el.dataset.act;
  const id = el.dataset.id;

  if(act==="setlang") setLang(el.dataset.lang);
  else if(act==="goreports"){ state.view={screen:"reports"}; render(); }
  else if(act==="backfloor"){ state.view={screen:"floor"}; render(); }
  else if(act==="opentable") openTable(Number(id));
  else if(act==="setcat"){ state.activeCat=el.dataset.cat; state.searchTerm=""; render(); }
  else if(act==="additem"){ addItemToBill(state.menu.find(m=>m.id===id)); }
  else if(act==="newbill"){ addBillToTable(activeTable().id); }
  else if(act==="switchbill"){ switchBill(activeTable().id, id); }
  else if(act==="qty"){ changeQty(id, Number(el.dataset.d)); }
  else if(act==="note"){ setNote(id, el.dataset.tag); }
  else if(act==="sendkitchen"){ sendToKitchen(); }
  else if(act==="gocheckout"){ state._checkout = {discount:0,tip:0,method:"cash",received:""}; state.view={screen:"checkout",tableId:activeTable().id,billId:activeBill().id}; render(); }
  else if(act==="backorder"){ state.view={screen:"order",tableId:activeTable().id,billId:activeBill().id}; render(); }
  else if(act==="ckmethod"){ state._checkout.method = el.dataset.m; render(); }
  else if(act==="cancelitem"){ openModal({type:"cancelItem", lineId:id}); }
  else if(act==="openvoidbill"){ openModal({type:"voidBill", tableId:activeTable().id, billId:activeBill().id}); }
  else if(act==="openimage"){ openModal({type:"image", menuId:id}); }
  else if(act==="openedit"){ openModal({type:"editItem", menuId:id}); }
  else if(act==="opendelete"){ openModal({type:"deleteItem", menuId:id}); }
  else if(act==="openadd"){ openModal({type:"addItem", cat: state.activeCat}); }
  else if(act==="openreceive"){ openModal({type:"receiveStock", menuId:id}); }
  else if(act==="opencustomer"){ openModal({type:"customer", id: id||null}); }
  else if(act==="opendeletecustomer"){ openModal({type:"deleteCustomer", id:id}); }
  else if(act==="reporttab"){ state.reportTab = el.dataset.tab; render(); }
  else if(act==="openreset"){ openModal({type:"reset"}); }
  else if(act==="printinvoice"){ printInvoice(); }
  else if(act==="openqr"){ openModal({type:"qr"}); }
  else if(act==="openconfirmpay"){ openModal({type:"confirmPay"}); }
  else if(act==="opensyncsettings"){ openModal({type:"syncSettings"}); }
  else if(act==="closemodal"){ closeModal(); }
}

function attachModalHandlers(root){
  root.querySelectorAll(".overlay").forEach(ov=>{
    ov.addEventListener("click",(e)=>{ if(e.target===ov) closeModal(); });
  });
  root.querySelectorAll("[data-act]").forEach(el=>{
    el.addEventListener("click",(e)=>{
      const act = el.dataset.act; const id = el.dataset.id;
      if(act==="closemodal") closeModal();
      else if(act==="clickfile") root.querySelector("#img-file").click();
      else if(act==="saveimageurl"){
        const url = root.querySelector("#img-url").value.trim();
        if(url) doSaveImageUrl(id,url);
      }
      else if(act==="removeimage") doRemoveImage(id);
      else if(act==="saveedit" || act==="saveadd"){
        const name = root.querySelector("#f-name").value.trim();
        const price = Number(root.querySelector("#f-price").value);
        const cost = Number(root.querySelector("#f-cost").value);
        const stock = Number(root.querySelector("#f-stock").value);
        if(!name || isNaN(price) || isNaN(cost) || isNaN(stock)){ root.querySelector("#f-err").classList.remove("hidden"); return; }
        if(act==="saveedit") doEditMenuItem(id,{name,price,cost,stock});
        else doAddMenuItem(el.dataset.cat,{name,price,cost,stock});
      }
      else if(act==="confirmdelete") doDeleteMenuItem(id);
      else if(act==="confirmcancelitem" || act==="confirmvoidbill"){
        const staff = root.querySelector("#f-staff").value.trim();
        const reason = root.querySelector("#f-reason").value.trim();
        if(!staff || !reason){ root.querySelector("#f-err").classList.remove("hidden"); return; }
        if(act==="confirmcancelitem") doCancelSentItem(id,staff,reason);
        else doVoidBill(state.modal.tableId, state.modal.billId, staff, reason);
      }
      else if(act==="confirmreset") resetAllData();
      else if(act==="confirmreceive"){
        const qty = Number(root.querySelector("#f-qty").value)||0;
        if(qty>0) doReceiveStock(id,qty);
      }
      else if(act==="savecustomer"){
        const name = root.querySelector("#f-cname").value.trim();
        const phone = root.querySelector("#f-cphone").value.trim();
        const note = root.querySelector("#f-cnote").value.trim();
        if(!name){ root.querySelector("#f-err").classList.remove("hidden"); return; }
        if(id) doEditCustomer(id,{name,phone,note});
        else doAddCustomer({name,phone,note});
      }
      else if(act==="confirmdeletecustomer") doDeleteCustomer(id);
      else if(act==="confirmpaysubmit"){
        const staff = root.querySelector("#f-staff").value.trim();
        if(!staff){ root.querySelector("#f-err").classList.remove("hidden"); return; }
        submitPayment(staff);
      }
      else if(act==="openbanksettings") openModal({type:"banksettings"});
      else if(act==="savebankaccount"){
        const bankName = root.querySelector("#f-bankname").value.trim();
        const accountName = root.querySelector("#f-accname").value.trim();
        const accountNumber = root.querySelector("#f-accnum").value.trim();
        if(bankName && accountName && accountNumber) doSaveBankAccount({bankName,accountName,accountNumber});
      }
      else if(act==="deletebankaccount") doDeleteBankAccount(Number(id));
      else if(act==="generateqr"){
        const sel = root.querySelector("#f-bank-select");
        const bank = state.bankAccounts.find(b=>String(b.id)===sel.value);
        const target = root.querySelector("#qr-target");
        target.classList.remove("hidden");
        target.innerHTML = "";
        const ck = state._checkout;
        const total = billTotal(activeBill());
        const net = Math.max(0, total - ck.discount + ck.tip);
        const payload = bank
          ? `BANK:${bank.bankName}|ACCT_NAME:${bank.accountName}|ACCT_NO:${bank.accountNumber}|AMOUNT:${net}|CURRENCY:LAK`
          : `AMOUNT:${net}|CURRENCY:LAK`;
        if(window.QRCode){ new QRCode(target, { text: payload, width:180, height:180 }); }
        else { target.textContent = "QR library not loaded"; }
      }
      else if(act==="savesheeturl"){
        const url = root.querySelector("#f-sheet-url").value.trim();
        setSheetUrl(url);
        closeModal();
      }
      else if(act==="testsheeturl"){
        const url = root.querySelector("#f-sheet-url").value.trim();
        const msg = root.querySelector("#sheet-test-msg");
        msg.style.color = "var(--dim)"; msg.textContent = t("sheetTestSending",state.lang);
        const prevUrl = state.sheetUrl;
        state.sheetUrl = url;
        testSheetConnection().then(ok=>{
          state.sheetUrl = prevUrl;
          msg.style.color = ok ? "var(--leaf)" : "var(--chili)";
          msg.textContent = ok ? t("sheetTestOk",state.lang) : t("sheetTestFail",state.lang);
        });
      }
      else if(act==="disconnectsheet"){ disconnectSheet(); }
    });
  });
  const fileInput = root.querySelector("#img-file");
  if(fileInput){
    fileInput.addEventListener("change",(e)=>{
      const file = e.target.files[0];
      if(file) doUploadImageFile(state.modal.menuId, file);
    });
  }
}

/* =========================================================
   PAYMENT + PRINT
========================================================= */
function submitPayment(staff){
  state.modal = null;
  const tb = activeTable(); const bill = activeBill();
  const ck = state._checkout;
  const total = billTotal(bill);
  const net = Math.max(0, total - ck.discount + ck.tip);
  const soldItems = bill.items.filter(it=>it.status!=="cancelled");
  const totalCost = soldItems.reduce((s,it)=>s+(it.cost||0)*it.qty,0);
  const record = {
    id: uid(), time:new Date().toISOString(), tableId:tb.id, tableName:tb.name, billLabel:bill.label,
    staff, method:ck.method, discount:ck.discount, tip:ck.tip, total:net, totalCost,
    items: soldItems.map(it=>({menuId:it.menuId,name:it.name,qty:it.qty,price:it.price,cost:it.cost||0})),
    _billId: bill.id,
  };
  finalizeSale(record);
}
function printInvoice(){
  const tb = activeTable(); const bill = activeBill();
  const total = billTotal(bill);
  document.getElementById("p-title").textContent = "ໃບບິນ / INVOICE";
  document.getElementById("p-sub").textContent = `${tb.name} / ${bill.label} — ${new Date().toLocaleString()}`;
  const lines = bill.items.filter(it=>it.status!=="cancelled").map(it=>
    `<div class="p-line"><span>${it.name} x${it.qty}</span><span>${money(it.price*it.qty)}</span></div>`
  ).join("");
  document.getElementById("p-lines").innerHTML = lines;
  document.getElementById("p-total").innerHTML = `<div class="p-line"><span>${t("grandTotal",state.lang)}</span><span>${money(total)}</span></div>`;
  document.getElementById("p-thanks").textContent = "ຂອບໃຈທີ່ອຸດໜູນ / Thank you";
  window.print();
}

   INIT
========================================================= */
loadData();
